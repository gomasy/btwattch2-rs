[package]
name = "btwattch2"
version = "1.2.4"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
btleplug = "0.13.2"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "time", "signal"] }
uuid = "1.26.1"

[lints.clippy]
# A dropped connection or a malformed frame may not be able to take the process
# down. Nothing outside the tests unwraps today; denying it is what keeps that
# true as the code grows, and the `check` workflow runs clippy with -D warnings
# so it is enforced on every push. Tests are exempt via clippy.toml — there, a
# panic is how a failure is reported.
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
strip = true
panic = "abort"
opt-level = "z"
codegen-units = 1
